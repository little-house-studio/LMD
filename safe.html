<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>LTHS 安全模式</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #f8f3eb 0%, #eef3f7 100%);
        color: #12212c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(760px, 100%);
        padding: 28px;
        border: 1px solid rgba(26, 52, 67, 0.14);
        border-radius: 28px;
        background: rgba(255, 252, 247, 0.94);
        box-shadow: 0 16px 40px rgba(17, 24, 39, 0.08);
      }

      p {
        margin: 0 0 12px;
        color: #4a6270;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.02;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 18px;
      }

      a {
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid rgba(26, 52, 67, 0.14);
        color: #12212c;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.72);
      }

      a.primary {
        border-color: transparent;
        color: #fff;
        background: linear-gradient(135deg, #c2410c, #0f766e);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p>静态安全模式</p>
      <h1>服务器可正常访问</h1>
      <p>
        这个页面是纯 HTML，不依赖 React 编辑器 bundle。只要它能正常打开，就说明本地 Web 服务是健康的，剩余问题多半在应用启动链路内部。
      </p>
      <div class="actions">
        <a class="primary" href="./">打开完整编辑器</a>
        <a href="./?safe=1">打开 React 安全模式</a>
        <a href="./?reset=1">重置本地工作区</a>
      </div>
    </main>
  </body>
</html>
