<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>LTHS Mermaid 工作台</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, "SF Mono", "Segoe UI", sans-serif;
        background: #070708;
        color: #f4f4f5;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        background:
          radial-gradient(circle, rgba(255, 255, 255, 0.1) 0.7px, transparent 0.9px),
          #070708;
        background-size: 12px 12px, auto;
      }

      .boot-shell {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }

      .boot-card {
        width: min(720px, 100%);
        padding: 28px;
        border: 1.5px solid rgba(214, 255, 58, 0.45);
        border-radius: 0;
        background: #0c0c0e;
        box-shadow: 6px 6px 0 #000;
      }

      .boot-card p {
        margin: 0 0 10px;
        color: #b8b8be;
      }

      .boot-card h1 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        line-height: 1.05;
        letter-spacing: 0.02em;
        color: #d6ff3a;
      }

      .boot-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 18px;
      }

      .boot-grid div {
        padding: 14px;
        border-radius: 0;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #101012;
        box-shadow: 3px 3px 0 #000;
      }

      .boot-grid strong,
      .boot-grid span {
        display: block;
      }

      .boot-grid span {
        margin-top: 6px;
        color: #8a8a94;
        font-size: 0.86rem;
      }

      .boot-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .boot-actions a {
        padding: 10px 14px;
        border-radius: 0;
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #f4f4f5;
        text-decoration: none;
        background: #141417;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 0.72rem;
        box-shadow: 3px 3px 0 #000;
      }

      .boot-actions a.primary {
        border-color: #d6ff3a;
        color: #0a0a0c;
        background: #d6ff3a;
      }

      .boot-status {
        margin-top: 18px;
        padding: 14px;
        border-radius: 0;
        background: #101012;
        border: 1px solid rgba(0, 240, 255, 0.35);
        color: #b8b8be;
        font-size: 0.86rem;
      }

      @media (max-width: 720px) {
        .boot-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell">
        <div class="boot-card">
          <p>工作台启动中</p>
          <h1>LTHS Mermaid 工作台</h1>
          <p>
            编辑器正在启动。这个兜底壳层是纯静态 HTML，所以如果你能看到它，但应用始终没有出现，问题通常在 JavaScript 启动链路，而不是基础 Web 服务本身。
          </p>
          <div class="boot-grid">
            <div>
              <strong>画布 + 源码</strong>
              <span>React 完成启动后，这张卡片应该会被应用界面自动替换。</span>
            </div>
            <div>
              <strong>快速排查</strong>
              <span>如果编辑器卡住，可以先尝试下面的安全模式或重置入口。</span>
            </div>
          </div>
          <div class="boot-actions">
            <a class="primary" href="?safe=1">打开安全模式</a>
            <a href="?reset=1">重置本地工作区</a>
            <a href="?reset=1&amp;safe=1">安全模式 + 重置</a>
          </div>
          <div class="boot-status">
            如果这个界面持续停留超过几秒，通常表示应用 bundle 加载过慢，或者在主界面绘制前就已经触发了运行时错误。
          </div>
          <noscript>
            <div class="boot-status">
              JavaScript 当前被禁用，因此编辑器无法启动。请先启用 JavaScript，才能进入完整工作台。
            </div>
          </noscript>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
