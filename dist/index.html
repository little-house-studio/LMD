<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>LTHS Mermaid 工作台</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          linear-gradient(180deg, #f8f3eb 0%, #eef3f7 100%);
        color: #12212c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
      }

      .boot-shell {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }

      .boot-card {
        width: min(720px, 100%);
        padding: 28px;
        border: 1px solid rgba(26, 52, 67, 0.14);
        border-radius: 28px;
        background: rgba(255, 252, 247, 0.92);
        box-shadow: 0 16px 40px rgba(17, 24, 39, 0.08);
      }

      .boot-card p {
        margin: 0 0 10px;
        color: #4a6270;
      }

      .boot-card h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.02;
      }

      .boot-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 18px;
      }

      .boot-grid div {
        padding: 14px;
        border-radius: 18px;
        border: 1px solid rgba(26, 52, 67, 0.1);
        background: rgba(255, 255, 255, 0.72);
      }

      .boot-grid strong,
      .boot-grid span {
        display: block;
      }

      .boot-grid span {
        margin-top: 6px;
        color: #4a6270;
      }

      .boot-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 18px;
      }

      .boot-actions a {
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid rgba(26, 52, 67, 0.14);
        color: #12212c;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.72);
      }

      .boot-actions a.primary {
        border-color: transparent;
        color: #fff;
        background: linear-gradient(135deg, #c2410c, #0f766e);
      }

      .boot-status {
        margin-top: 18px;
        padding: 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(26, 52, 67, 0.1);
      }

      @media (max-width: 720px) {
        .boot-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <script type="module" crossorigin src="/LTHS_MD/assets/index-orN6RQka.js"></script>
    <link rel="stylesheet" crossorigin href="/LTHS_MD/assets/index-DJqvsNJK.css">
  </head>
  <body>
    <div id="root">
      <div class="boot-shell">
        <div class="boot-card">
          <p>工作台启动中</p>
          <h1>LTHS Mermaid 工作台</h1>
          <p>
            编辑器正在启动。这个兜底壳层是纯静态 HTML，所以如果你能看到它，但应用始终没有出现，问题通常在 JavaScript 启动链路，而不是基础 Web 服务本身。
          </p>
          <div class="boot-grid">
            <div>
              <strong>画布 + 源码</strong>
              <span>React 完成启动后，这张卡片应该会被应用界面自动替换。</span>
            </div>
            <div>
              <strong>快速排查</strong>
              <span>如果编辑器卡住，可以先尝试下面的安全模式或重置入口。</span>
            </div>
          </div>
          <div class="boot-actions">
            <a class="primary" href="/?safe=1">打开安全模式</a>
            <a href="/?reset=1">重置本地工作区</a>
            <a href="/?reset=1&amp;safe=1">安全模式 + 重置</a>
          </div>
          <div class="boot-status">
            如果这个界面持续停留超过几秒，通常表示应用 bundle 加载过慢，或者在主界面绘制前就已经触发了运行时错误。
          </div>
          <noscript>
            <div class="boot-status">
              JavaScript 当前被禁用，因此编辑器无法启动。请先启用 JavaScript，才能进入完整工作台。
            </div>
          </noscript>
        </div>
      </div>
    </div>
  </body>
</html>
